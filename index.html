const KEY='finansim_v1';const empty=()=>({accounts:[],transactions:[],savings:[],prices:{gold:null,USD:null,EUR:null,GBP:null,updated:null},salary:0,claims:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||empty()}catch{db=empty()}db={...empty(),...db};if(!Array.isArray(db.claims))db.claims=[];const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const fmt=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(n||0);const num=x=>Number(String(x||'0').replace(',','.'))||0;const date=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{if(!sessionUser){localStorage.setItem(KEY,JSON.stringify(db))}else{scheduleCloudSave()}render()};const toast=s=>{let e=document.querySelector('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};const account=id=>db.accounts.find(a=>a.id===id);const active=type=>db.accounts.filter(a=>!a.archived&&(!type||a.type===type));const opts=(arr)=>arr.map(a=>`<option value="${esc(a.id)}">${a.type==='credit'?'💳 Kredi Kartı':a.type==='cash'?'💵 Nakit':'🏦 Banka'} — ${esc(a.name)}</option>`).join('');const moneyField=(id,label='Tutar (TL)')=>`<label>${label}</label><input id="${id}" type="number" step="0.01" min="0" inputmode="decimal" required>`;const textField=(id,label,placeholder='')=>`<label>${label}</label><input id="${id}" placeholder="${placeholder}">`;const selectField=(id,label,options)=>`<label>${label}</label><select id="${id}">${options}</select>`;const foot=(fn)=>`<div class="row"><button onclick="closeModal()">Vazgeç</button><button class="save" onclick="${fn}">Kaydet</button></div>`;const val=id=>document.getElementById(id)?.value;function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show')}function requireAmount(id){let n=num(val(id));if(n<=0){toast('Geçerli bir tutar gir');throw Error('amount')}return n}
function cardTotal(a){return a.type==='credit' ? -(num(a.used)||0) : num(a.balance)}function currentNet(){return db.accounts.reduce((s,a)=>s+cardTotal(a),0)}function nextFifth(){let d=new Date(),x=new Date(d.getFullYear(),d.getMonth(),5);if(d.getDate()>5)x=new Date(d.getFullYear(),d.getMonth()+1,5);return x}function formatDay(d){return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}function forecastItems(){let cutoff=nextFifth(),today=new Date();cutoff.setHours(23,59,59,999);today.setHours(0,0,0,0);let planned=db.transactions.filter(t=>t.kind==='expected'&&t.status!=='done'&&t.status!=='cancelled'&&t.due&&new Date(t.due+'T12:00:00')<=cutoff&&new Date(t.due+'T12:00:00')>=today).map(t=>({title:t.title,due:t.due,signed:num(t.signed),detail:'Planlanan işlem'}));let claims=(db.claims||[]).filter(c=>num(c.remaining)>0&&c.due&&new Date(c.due+'T12:00:00')<=cutoff&&new Date(c.due+'T12:00:00')>=today).map(c=>({title:c.party+' · '+(c.direction==='receivable'?'Alacak tahsilatı':'Borç ödemesi'),due:c.due,signed:num(c.remaining)*(c.direction==='receivable'?1:-1),detail:'Cari vadesi'}));return [...planned,...claims]}

function expectedSummary(){return forecastItems().map(t=>`${esc(t.title)}: ${fmt(t.signed)}`).join(' · ')||'Bu tarihe kadar beklenen kayıt yok'}
function showForecast(){let items=forecastItems(),base=currentNet(),delta=items.reduce((s,t)=>s+num(t.signed),0);modal('Tahmini Varlık Hesabı',`<div class="smallcard"><div class="row"><span>Güncel net varlık</span><strong>${fmt(base)}</strong></div></div>${items.map(t=>`<div class="transaction row"><div><strong>${esc(t.title)}</strong><div class="sub">${esc(t.due)} · ${esc(t.detail)}</div></div><strong class="${num(t.signed)>=0?'green':'red'}">${fmt(t.signed)}</strong></div>`).join('')||'<p class="muted">Bu tarihe kadar beklenen işlem yok.</p>'}<div class="smallcard row"><strong>${formatDay(nextFifth())} tahmini</strong><strong class="green">${fmt(base+delta)}</strong></div><p class="hint">Tahmin, kayıtlı beklenen işlemler ve vadesi gelen cari bakiyelerden oluşur. Aynı tahsilatı hem cari vadesi hem ayrı beklenen işlem olarak girersen iki kez sayılır. Kredi kartı ekstre otomasyonu henüz yoktur.</p>`)}
function savingsValue(){return db.savings.reduce((s,a)=>s+num(a.qty)*num(db.prices[a.kind]),0)}function localDateParts(value){let x=String(value||date()).slice(0,10).split('-').map(Number);return {y:x[0],m:x[1],d:x[2]}}
function isoDay(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function installmentSchedule(t,a){let count=Math.max(1,Math.floor(num(t.installments)||1)),amount=Math.abs(num(t.signed)),parts=localDateParts(t.date),cut=Math.min(31,Math.max(1,Number(a.cut)||1)),pay=Math.min(28,Math.max(1,Number(a.pay)||8));let firstMonth=new Date(parts.y,parts.m-1+(parts.d>cut?1:0),1);return Array.from({length:count},(_,i)=>{let statement=new Date(firstMonth.getFullYear(),firstMonth.getMonth()+i,cut);let due=new Date(statement.getFullYear(),statement.getMonth()+1,pay);let value=i===count-1?Math.round((amount-Math.round(amount/count*100)/100*(count-1))*100)/100:Math.round(amount/count*100)/100;return {number:i+1,statement:isoDay(statement.getFullYear(),statement.getMonth()+1,statement.getDate()),due:isoDay(due.getFullYear(),due.getMonth()+1,due.getDate()),value}})}

function showCurrentNet(){let banks=db.accounts.filter(a=>a.type!=='credit'),cards=db.accounts.filter(a=>a.type==='credit'),balance=banks.reduce((v,a)=>v+num(a.balance),0),debt=cards.reduce((v,a)=>v+num(a.used),0);let bankRows=banks.map(a=>`<div class="transaction row"><span>${a.type==='cash'?'💵':'🏦'} ${esc(a.name)}</span><strong class="${num(a.balance)<0?'red':'green'}">${fmt(a.balance)}</strong></div>`).join('');let cardRows=cards.map(a=>{let installments=cardInstallments(a),groups=installments.reduce((out,item)=>{let key=item.due.slice(0,7);(out[key]??=[]).push(item);return out},{});let schedule=Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([month,items])=>`<div class="smallcard"><div class="row"><strong>📅 ${esc(month)} · Son ödeme ayı</strong><strong>${fmt(items.reduce((v,i)=>v+i.value,0))}</strong></div>${items.map(i=>`<div class="transaction"><div class="row"><span>${esc(i.title)} · ${i.number}/${i.count}</span><strong>${fmt(i.value)}</strong></div><div class="sub">Ekstre: ${esc(i.statement)} · Son ödeme: ${esc(i.due)}</div></div>`).join('')}</div>`).join('');return `<div class="smallcard"><div class="row"><strong>💳 ${esc(a.name)}</strong><strong class="red">−${fmt(a.used)}</strong></div><div class="muted">Kesim: ${a.cut||1} · Son ödeme: ${a.pay||8}</div>${installments.length?`<p class="hint">Taksitli alışverişlerin ödeme planı:</p>${schedule}`:'<p class="hint">Kayıtlı taksitli alışveriş bulunmuyor.</p>'}</div>`}).join('');modal('Güncel Net Varlık Detayları',`<div class="smallcard"><div class="row"><span>Banka ve nakit</span><strong class="green">${fmt(balance)}</strong></div><div class="row"><span>Kredi kartı toplam borcu</span><strong class="red">−${fmt(debt)}</strong></div><hr style="border:0;border-top:1px solid #354862"><div class="row"><strong>Güncel net varlığım</strong><strong class="${currentNet()<0?'red':'green'}">${fmt(currentNet())}</strong></div></div><div class="label">BANKA VE NAKİT</div>${bankRows||'<p class="muted">Hesap yok.</p>'}<div class="label">KREDİ KARTLARI VE TAKSİTLER</div>${cardRows||'<p class="muted">Kredi kartı yok.</p>'}<p class="hint">Taksitler kart borcunun içinde zaten bulunur, net varlıktan tekrar düşülmez. Ödeme takvimi alışveriş tarihine ve kesim gününe göre hesaplanan planlamadır; eski kart borçlarının hangi taksitlerden oluştuğu bilinmez. Ödenmiş taksitlerin otomatik eşleştirilmesi henüz yoktur.</p>`)}
function render(){document.getElementById('dashboard').innerHTML=`<div class="label">GENEL BAKIŞ</div><div class="card" onclick="showCurrentNet()" style="cursor:pointer"><div class="name">💰 GÜNCEL NET VARLIĞIM <span style="float:right">›</span></div><div class="amount ${currentNet()<0?'red':'green'}">${fmt(currentNet())}</div><div class="muted">Nakit + banka − kart borçları · Tahsil edilmemiş alacaklar hariç</div></div><div class="card" onclick="showForecast()" style="cursor:pointer"><div class="name">📅 ${formatDay(nextFifth()).toLocaleUpperCase('tr-TR')} TAHMİNİ</div><div class="amount ${projected()<0?'red':'green'}">${fmt(projected())}</div><div class="muted">Planlanan işlemler dahil · ${expectedSummary()}</div></div><div class="card" onclick="openSavings()" style="cursor:pointer"><div class="row"><div class="name">🪙 NET BİRİKİMLERİM</div><span>›</span></div><div class="amount gold">${fmt(savingsValue())}</div><div class="muted">Altın ve döviz · Detaylar için dokun</div></div><p class="notice">Birikimler cari net varlığa eklenmez. Döviz referans kurları ve gram altın alış fiyatı internet üzerinden güncellenebilir.</p>`;
let banks=active().filter(a=>a.type!=='credit'),credits=active('credit');document.getElementById('accounts').innerHTML=`<div class="label">BANKA VE NAKİT HESAPLARIM</div>${banks.map(a=>`<div class="smallcard" onclick="editAccount('${a.id}')"><div class="row"><strong>${a.type==='cash'?'💵':'🏦'} ${esc(a.name)}</strong><span class="badge">Düzenle ›</span></div><div class="amount" style="font-size:25px">${fmt(a.balance)}</div></div>`).join('')}<button class="add" onclick="addAccount('bank')">+ Banka / Nakit Hesabı Ekle</button><div class="label">KREDİ KARTLARIM</div>${credits.map(a=>`<div class="smallcard" onclick="editAccount('${a.id}')"><div class="row"><strong>💳 ${esc(a.name)}</strong><span class="badge">Düzenle ›</span></div><div class="row" style="margin-top:12px"><div><div class="muted">Kullanılabilir limit</div><strong class="green">${fmt(num(a.limit)-num(a.used))}</strong></div><div style="text-align:right"><div class="muted">Toplam borç</div><strong class="red">${fmt(a.used)}</strong></div></div><div class="muted" style="margin-top:12px">Toplam limit ${fmt(a.limit)} · Kesim: ${a.cut||1} · Ödeme: ${a.pay||8}</div></div>`).join('')}<button class="add" onclick="addAccount('credit')">+ Kredi Kartı Ekle</button>`;
let tx=[...db.transactions].sort((a,b)=>String(b.date).localeCompare(String(a.date)));document.getElementById('movements').innerHTML=`<div class="label">YENİ İŞLEM</div><div class="actions"><button class="primary" onclick="openTransaction('income')">＋ Para Girişi</button><button class="primary out" onclick="openTransaction('expense')">− Para Çıkışı</button><button class="primary blue" onclick="openTransfer()">⇄ Transfer</button><button class="primary goldbtn" onclick="openPerson()">👤 Borç / Alacak</button><button class="primary blue wide" onclick="openCardPayment()">💳 Kredi Kartı Borcu Öde</button><button class="primary blue wide" onclick="openExpected()">📅 Gelecek Gelir / Ödeme Planla</button></div><div class="label">ŞİRKET VE KİŞİSEL CARİLER</div><button class="add" onclick="openBusinessExpense()">🏢 Şirket adına harcama kaydet</button><button class="add" onclick="openClaim()">👥 Yeni alacak / borç kaydet</button>${db.claims.filter(c=>num(c.remaining)>0).map(c=>`<div class="smallcard"><div class="row"><strong>${esc(c.party)}</strong><strong class="${c.direction==='receivable'?'green':'red'}">${c.direction==='receivable'?'+':'−'}${fmt(c.remaining)}</strong></div><div class="muted">${c.direction==='receivable'?'Alacak':'Borç'} · ${esc(c.due||'Vade yok')} · ${esc(c.note||'')}</div><button class="link" onclick="openClaimSettlement('${c.id}')">${c.direction==='receivable'?'Tahsilat yap':'Borç öde'}</button></div>`).join('')}<div class="label">İŞLEM GEÇMİŞİ</div>${tx.length?tx.map(t=>`<div class="transaction row"><div><strong>${esc(t.title)}</strong><div class="sub">${esc(t.date)} · ${esc(t.detail||t.kind)}</div></div><div style="text-align:right"><strong class="${num(t.signed)>=0?'green':'red'}">${num(t.signed)>0?'+':''}${fmt(t.signed)}</strong><div>${t.kind==='expected'&&t.status!=='done'&&t.status!=='cancelled'?`<button class="link" onclick="finishExpected('${t.id}')">Gerçekleşti</button> <button class="link" onclick="cancelExpected('${t.id}')">İptal</button> `:''}<button class="link" onclick="removeTransaction('${t.id}')">Sil</button></div></div></div>`).join(''):'<p class="muted">Henüz işlem yok.</p>'}`;}
function go(n){let p=document.getElementById('pages');p.scrollTo({left:p.clientWidth*n,behavior:'smooth'})}document.getElementById('pages').addEventListener('scroll',()=>{let p=document.getElementById('pages'),n=Math.round(p.scrollLeft/p.clientWidth);document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===n))});function addAccount(type){modal('Yeni Hesap',selectField('atype','Hesap Türü','<option value="bank">Banka hesabı</option><option value="cash">Nakit cüzdan</option><option value="credit">Kredi kartı</option>')+textField('aname','Hesap / Kart Adı','Örn. Ziraat')+moneyField('abalance','Başlangıç bakiyesi / Kullanılmış limit')+moneyField('alimit','Kart toplam limiti (yalnız kart için)')+foot('saveAccount()'));document.getElementById('atype').value=type}function saveAccount(){let name=val('aname').trim();if(!name)return toast('Hesap adı gerekli');let type=val('atype'),a={id:uid(),name,type,balance:type==='credit'?0:num(val('abalance')),used:type==='credit'?num(val('abalance')):0,limit:num(val('alimit')),cut:1,pay:8};db.accounts.push(a);save();closeModal()}function editAccount(id){let a=account(id);modal('Hesabı Düzenle',textField('aname','Hesap Adı')+moneyField('abalance',a.type==='credit'?'Güncel toplam kart borcu':'Güncel bakiye')+(a.type==='credit'?moneyField('alimit','Toplam limit')+'<p class="hint">Hesap kesim günü 1, son ödeme günü 8 olarak tanımlıdır.</p>':'')+`<div class="row"><button onclick="archiveAccount('${id}')">Arşivle</button><button class="save" onclick="updateAccount('${id}')">Kaydet</button></div>`);document.getElementById('aname').value=a.name;document.getElementById('abalance').value=a.type==='credit'?a.used:a.balance;if(a.type==='credit')document.getElementById('alimit').value=a.limit}function updateAccount(id){let a=account(id);a.name=val('aname').trim()||a.name;if(a.type==='credit'){a.used=num(val('abalance'));a.limit=num(val('alimit'))}else a.balance=num(val('abalance'));save();closeModal()}function archiveA let goldCheckStarted=false, goldRequestBusy=false;
async function goldFetch(url){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{const r=await fetch(url,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}
}
function goldValidate(price,rawDate,source,stale){
 price=Number(price);
 if(!Number.isFinite(price)||price<100||price>1000000)throw Error(source+': alış fiyatı geçersiz');
 if(!rawDate)throw Error(source+': fiyat tarihi yok');
 const stamp=new Date(rawDate),age=Date.now()-stamp.getTime();
 if(!Number.isFinite(age))throw Error(source+': tarih okunamadı');
 if(age < -10*60000)throw Error(source+': kaynak tarihi gelecekte');
 if(stale || age>90*60000)throw Error(source+': eski veri ('+stamp.toLocaleString('tr-TR')+')');
 return {price,stamp,source};
}
async function refreshGold(silent=false){
 if(goldRequestBusy)return;goldRequestBusy=true;
 const failures=[];let quote=null;
 try{
  try{
   const j=await goldFetch('https://altingrafigi.com/api/v1/prices');
   const rows=Array.isArray(j.data)?j.data:[];
   const row=rows.find(x=>String(x.category||'').toLocaleUpperCase('tr-TR')==='GRAM ALTIN' && /gram/i.test(String(x.name||'')))
      ||rows.find(x=>/gram altın/i.test(String(x.name||'')));
   if(!row)throw Error('Gram altın satırı bulunamadı');
   quote=goldValidate(row.bid,row.timestamp||j.updatedAt,'Altın Grafiği / '+(row.name||row.symbol),false);
  }catch(e){failures.push(String(e.message||e))}
  if(!quote){
   try{
    const j=await goldFetch('https://cdn.jsdelivr.net/gh/MehmetAkgul/currency-api-tr@main/v1/currencies/try-full.json');
    quote=goldValidate(j?.try?.xau_gram?.bid,j?.try?.xau_gram?.updated_at||j?.updated_at,'currency-api-tr',j?.is_stale===true);
   }catch(e){failures.push(String(e.message||e))}
  }
  db.prices.goldCheckedAt=new Date().toISOString();
  if(quote){
   db.prices.gold=quote.price;db.prices.goldQuoteAt=quote.stamp.toISOString();db.prices.goldSource=quote.source;
   db.prices.goldStatus='ALIŞ fiyatı güncellendi ('+quote.source+'): '+quote.stamp.toLocaleString('tr-TR');
   db.prices.updated=db.prices.goldCheckedAt;save();
   if(!silent)toast('Gram altın ALIŞ: '+fmt(quote.price));
  }else{
   db.prices.goldStatus='Güncel fiyat alınamadı. '+failures.join(' | ')+'. Son fiyat korundu.';
   console.warn('Altın kaynakları başarısız:',failures);
   if(!silent)toast('Altın kaynakları güncel fiyat göndermedi.');
  }
  if(document.getElementById('overlay').classList.contains('show')&&document.getElementById('modalTitle').textContent==='Net Birikimlerim')openSavings();
 }finally{goldRequestBusy=false}
}
async function refreshFx(silent=false){try{let res=await fetch('https://api.frankfurter.dev/v2/rates?base=TRY&quotes=USD,EUR,GBP',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json(),rows=Array.isArray(data)?data:(Array.isArray(data.rates)?data.rates:[]);let found={};for(let row of rows){let k=row.quote||row.currency||row.symbol;if(['USD','EUR','GBP'].includes(k)&&Number(row.rate)>0)found[k]=1/Number(row.rate)}if(Object.keys(found).length!==3)throw Error('Eksik kur');Object.assign(db.prices,found);db.prices.updated=new Date().toISOString();db.prices.fxSource='Frankfurter günlük referans';save();if(document.getElementById('overlay').classList.contains('show')&&document.getElementById('modalTitle').textContent==='Net Birikimlerim')openSavings();if(!silent)toast('Döviz referans kurları güncellendi')}catch(e){if(!silent)toast('Kur alınamadı; fiyatları elle girebilirsin')}}
function removeTransaction(id){let t=db.transactions.find(x=>x.id===id);if(!t||!confirm('Bu işlem silinsin ve hesap etkisi geri alınsın mı?'))return;let a=account(t.accountId);if(['business','claimcreate','claimsettle'].includes(t.kind)){toast('Cari bağlantılı işlemler geçmişten silinemez; düzeltme için yeni kayıt oluştur.');return}if(t.kind==='expected'&&t.status==='done'&&a)a.balance-=num(t.signed);else if(t.kind==='income'&&a)a.balance-=num(t.signed);else if(t.kind==='expense'&&a){if(a.type==='credit')a.used-=Math.abs(t.signed);else a.balance+=Math.abs(t.signed)}else if(t.kind==='transfer'){account(t.from).balance+=t.amount;account(t.to).balance-=t.amount}else if(t.kind==='cardpay'){account(t.from).balance+=t.amount;account(t.to).used+=t.amount}else if(t.kind==='person'&&a)a.balance-=t.signed;else if(t.kind==='savings'){let s=db.savings.find(x=>x.kind===t.asset);if(s)s.qty+=t.action==='buy'?-t.qty:t.qty;if(a){if(a.type==='credit')a.used-=t.amount;else a.balance+=t.action==='buy'?t.amount:-t.amount}}db.transactions=db.transactions.filter(x=>x.id!==id);save()}

let sessionUser=null, cloudSession=null, syncStatus='Giriş bekleniyor', pendingCloudSave=false, cloudSaveTimer=null, cloudWriting=false, cloudLoading=false;
const AUTH_STORE='finansim_auth_v19';
function cloudStatus(s){syncStatus=s;let el=document.getElementById('syncStatusSettings');if(el)el.textContent=s;let badge=document.getElementById('cloudBadge');if(badge)badge.textContent=s}
function cloudHeaders(token){return {'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function authCall(path,payload){let r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Kimlik doğrulama başarısız');return d}
function persistSession(d){cloudSession={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000-60000,user:d.user};sessionStorage.setItem(AUTH_STORE,JSON.stringify(cloudSession));sessionUser=d.user?.id||null}
async function validToken(){if(!cloudSession)throw Error('Oturum yok');if(Date.now()>cloudSession.expires_at){let d=await authCall('token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});persistSession(d)}return cloudSession.access_token}
function showLogin(note=''){document.getElementById('overlay').classList.add('show');document.getElementById('modalTitle').textContent='🔐 Finansım — Giriş';document.getElementById('modalBody').innerHTML=`<p class="hint">Telefon ve bilgisayarda aynı e-posta ile giriş yap. Önceki deneme kayıtların otomatik olarak buluta aktarılmaz.</p><p class="hint" id="loginNote">${esc(note)}</p><label>E-posta</label><input id="loginEmail" type="email" autocomplete="username"><label>Şifre</label><input id="loginPassword" type="password" autocomplete="current-password"><div class="row"><button class="primary blue" onclick="cloudSignup()">Kayıt Ol</button><button class="primary" onclick="cloudLogin()">Giriş Yap</button></div>`;document.getElementById('overlay').onclick=()=>{}}
function authFields(){return {email:document.getElementById('loginEmail')?.value.trim(),password:document.getElementById('loginPassword')?.value}}
async function cloudSignup(){let a=authFields();if(!a.email||!a.password)return toast('E-posta ve şifre gir');try{await authCall('signup',a);document.getElementById('loginNote').textContent='Kayıt isteği gönderildi. E-postandaki doğrulama bağlantısına tıkla, sonra giriş yap.'}catch(e){document.getElementById('loginNote').textContent=e.message}}
async function cloudLogin(){let a=authFields();if(!a.email||!a.password)return toast('E-posta ve şifre gir');try{let d=await authCall('token?grant_type=password',a);persistSession(d);await cloudRead(true);document.getElementById('overlay').classList.remove('show');document.getElementById('overlay').onclick=e=>{if(e.target===e.currentTarget)closeModal()};toast('Bulut hesabına bağlandı')}catch(e){document.getElementById('loginNote').textContent='Giriş başarısız: '+e.message}}
async function cloudRead(initial=false){if(!sessionUser)return;cloudLoading=true;try{let token=await validToken();let r=await fetch(SB_URL+'/rest/v1/finansim_data?select=data&user_id=eq.'+encodeURIComponent(sessionUser),{headers:cloudHeaders(token),cache:'no-store'});if(!r.ok)throw Error('Bulut okuma: '+r.status);let rows=await r.json();if(rows.length){let d=rows[0].data;if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.transactions)||!Array.isArray(d.savings))throw Error('Bulut verisi geçersiz');db={...empty(),...d};if(!Array.isArray(db.claims))db.claims=[]}else{db=empty()}render();cloudStatus('☁️ Bulut verisi yüklendi');return true}catch(e){cloudStatus('⚠️ '+e.message);if(initial)throw e;toast('Buluttan veri okunamadı');return false}finally{cloudLoading=false}}
function scheduleCloudSave(){if(!sessionUser)return;pendingCloudSave=true;cloudStatus('⏳ Kaydediliyor...');clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(flushCloudSave,450)}
async function flushCloudSave(){if(!sessionUser||cloudWriting||!pendingCloudSave)return;cloudWriting=true;pendingCloudSave=false;let snapshot=JSON.parse(JSON.stringify(db));try{let token=await validToken();let r=await fetch(SB_URL+'/rest/v1/finansim_data?on_conflict=user_id',{method:'POST',headers:{...cloudHeaders(token),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:sessionUser,data:snapshot,updated_at:new Date().toISOString()})});if(!r.ok)throw Error('Bulut kayıt hatası: '+r.status);cloudStatus('✅ Buluta kaydedildi')}catch(e){pendingCloudSave=true;cloudStatus('⚠️ Kaydedilemedi — yeniden dene');toast('Bulut kaydı başarısız! İşlemleri sürdürmeden bağlantıyı kontrol et.')}finally{cloudWriting=false;if(pendingCloudSave){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(flushCloudSave,3000)}}}
async function manualSync(){if(pendingCloudSave||cloudWriting)return toast('Önce kayıt tamamlanmalı');if(!confirm('Buluttaki son kayıt bu cihazdaki görünümü yenileyecek. Devam?'))return;await cloudRead();closeModal()}
function signOutFinansim(){if(pendingCloudSave||cloudWriting)return toast('Önce buluta kaydedilmesini bekle');if(!confirm('Bu cihazda oturumu kapatmak istiyor musun?'))return;sessionStorage.removeItem(AUTH_STORE);sessionUser=null;cloudSession=null;db=empty();render();showLogin('Oturum kapatıldı')}
async function initCloud(){document.querySelector('main').style.visibility='hidden';try{let stored=sessionStorage.getItem(AUTH_STORE);if(stored){cloudSession=JSON.parse(stored);sessionUser=cloudSession.user?.id||null;if(sessionUser){await cloudRead(true);document.querySelector('main').style.visibility='visible';return}}}catch(e){sessionStorage.removeItem(AUTH_STORE);sessionUser=null;cloudSession=null}showLogin();document.querySelector('main').style.visibility='visible'}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sessionUser&&!pendingCloudSave&&!cloudWriting&&!cloudLoading)cloudRead()});
window.addEventListener('online',()=>{if(pendingCloudSave)flushCloudSave();else if(sessionUser)cloudRead()});

db=empty();render();initCloud();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
