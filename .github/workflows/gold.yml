name: Finansim Gram Altin
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate gram gold buying price
        env:
          HESAPLI_ALTIN_API_KEY: ${{ secrets.HESAPLI_ALTIN_API_KEY }}
        run: python update_gold.py
      - name: Commit new price if changed
        run: |
          if [ -f gold.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add gold.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update gram gold buying price'
              git push
            fi
          fi
